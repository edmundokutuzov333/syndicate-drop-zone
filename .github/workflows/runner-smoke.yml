name: Runner smoke test
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runner-smoke.yml"
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Prove runner allocation
        shell: bash
        run: |
          set -euxo pipefail
          echo "RUNNER_ASSIGNED=true"
          echo "RUNNER_IMAGE=${ImageOS:-unknown}"
          echo "RUNNER_VERSION=${RUNNER_TOOL_CACHE:-unknown}"
          echo "KERNEL=$(uname -a)"
          echo "NODE=$(node --version)"
          echo "PYTHON=$(python3 --version)"
          date -u +"UTC=%Y-%m-%dT%H:%M:%SZ"
          df -h / | tail -1
          nproc
