name: Build CAMPING 3D - Fase 04
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/blender/**"
      - "scripts/fetch-cc0-materials.mjs"
      - "scripts/validate-pbr-materials.mjs"
      - "scripts/3d/**"
      - "scripts/build-blend.sh"
      - "scripts/install-3d-toolchain.sh"
      - "scripts/verify-glb-contract.mjs"
      - "docs/camping-v3/scene-bible.json"
      - "package.json"
      - "docker/blender-ci/Dockerfile"
      - ".github/workflows/build-3d.yml"
concurrency:
  group: build-3d-${{ github.ref }}
  # Only certify the newest main revision; stale builds must not hold the queue.
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Build, reopen and certify Blender delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout main without downloading source LFS
        uses: actions/checkout@v7
        with:
          lfs: false
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip unzip xz-utils git-lfs libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 libice6 libx11-6 libxext6 libgomp1
      - name: Restore committed PBR maps from Git LFS without downloading Blender source
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          if git lfs ls-files | grep -F 'art/textures/materials/'; then
            git lfs pull --include="art/textures/materials/*.png" --exclude="art/xoyens-studio.blend"
          fi
      - name: Syntax and recovery tests without Blender
        shell: bash
        run: |
          set -euo pipefail
          find scripts -name '*.mjs' -type f -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
          find scripts -name '*.sh' -type f -print0 | while IFS= read -r -d '' file; do bash -n "$file"; done
          python3 -m py_compile scripts/blender/*.py
          node --test scripts/3d/recovery.test.mjs scripts/3d/pbr-materials.test.mjs
      - name: Shared route build, reopen, validate and package
        shell: bash
        run: bash scripts/3d/local-build.sh
      - name: Upload optimized model for the frontend publication job
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: camping-frontend-model-${{ github.sha }}
          path: |
            public/models/camping/xoyens-studio.glb
            public/models/camping/xoyens-studio.model.json
          if-no-files-found: error
          retention-days: 30
      - name: Render and verify Phase 06 evidence views
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/3d/env.sh ]; then source scripts/3d/env.sh; fi
          BLENDER_BIN="${BLENDER_BIN:-$(command -v blender)}"
          test -s art/xoyens-studio.blend
          LIBGL_ALWAYS_SOFTWARE=1 "$BLENDER_BIN" -b art/xoyens-studio.blend --python-exit-code 1 -P scripts/blender/capture_phase06.py -- art/_delivery/phase-06
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("art/_delivery/phase-06")
          manifest = json.loads((root / "capture-manifest.json").read_text())
          required = {"ceiling.png", "main-door.png"}
          if set(manifest.get("views", {})) != required:
              raise SystemExit("Phase 06 capture manifest must contain ceiling and main-door views")
          for name in sorted(required):
              path = root / name
              if not path.is_file() or path.stat().st_size < 10000:
                  raise SystemExit("Phase 06 capture missing or too small: " + str(path))
              if hashlib.sha256(path.read_bytes()).hexdigest() != manifest["views"][name]["sha256"]:
                  raise SystemExit("Phase 06 capture SHA-256 mismatch: " + name)
          print("PHASE 06 CAPTURES VERIFIED", json.dumps(manifest, sort_keys=True))
          PY
      - name: Write evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo "CAMPING V3 Fase 04"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Exit codes:"
            cat art/_delivery/exit-codes.txt 2>/dev/null || echo "not created"
            echo "Delivery SHA-256:"
            find art/_delivery -maxdepth 1 -name 'phase04-delivery-*.sha256' -type f -exec cat {} \; 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload outputs and evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fase04-entrega-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            art/_delivery/**
            !art/_delivery/phase04-delivery-*.zip
            !art/_delivery/phase04-delivery-*.tar.gz
            art/xoyens-studio.blend
            art/xoyens-studio.report.json
            art/out/xoyens-studio.raw.glb
            art/out/xoyens-studio.colliders.glb
            art/textures/materials/**
            art/textures/materials.manifest.json

  publish:
    name: Promote certified Blender source through real Git LFS
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout exact certified source commit without pulling old LFS binary
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          lfs: false
          fetch-depth: 0
      - name: Setup Node 24 for independent verification
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Git LFS and download certified delivery
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git-lfs
          git lfs install --local
      - name: Download certified Blender delivery
        uses: actions/download-artifact@v7
        with:
          name: fase04-entrega-${{ github.sha }}
          path: /tmp/fase04-delivery
      - name: Download optimized frontend model
        uses: actions/download-artifact@v7
        with:
          name: camping-frontend-model-${{ github.sha }}
          path: /tmp/camping-frontend-model
      - name: Reconstruct delivery, certify again and publish native file through LFS
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/fase04-delivery/xoyens-studio.blend
          test -s /tmp/fase04-delivery/xoyens-studio.report.json
          test -s /tmp/fase04-delivery/out/xoyens-studio.raw.glb
          test -s /tmp/fase04-delivery/out/xoyens-studio.colliders.glb
          test -s /tmp/fase04-delivery/textures/materials.manifest.json
          test -s /tmp/camping-frontend-model/xoyens-studio.glb
          test -s /tmp/camping-frontend-model/xoyens-studio.model.json
          test -s /tmp/fase04-delivery/_delivery/phase-06/ceiling.png
          test -s /tmp/fase04-delivery/_delivery/phase-06/main-door.png
          test -s /tmp/fase04-delivery/_delivery/phase-06/capture-manifest.json
          test -s /tmp/fase04-delivery/_delivery/manifest.json
          mkdir -p art/_delivery art/out
          cp -a /tmp/fase04-delivery/_delivery/. art/_delivery/
          mkdir -p docs/camping-v3/phase-06
          cp /tmp/fase04-delivery/_delivery/phase-06/ceiling.png docs/camping-v3/phase-06/ceiling.png
          cp /tmp/fase04-delivery/_delivery/phase-06/main-door.png docs/camping-v3/phase-06/main-door.png
          cp /tmp/fase04-delivery/_delivery/phase-06/capture-manifest.json docs/camping-v3/phase-06/capture-manifest.json
          cp /tmp/fase04-delivery/xoyens-studio.blend art/xoyens-studio.blend
          cp /tmp/fase04-delivery/xoyens-studio.report.json art/xoyens-studio.report.json
          cp /tmp/fase04-delivery/out/xoyens-studio.raw.glb art/out/xoyens-studio.raw.glb
          cp /tmp/fase04-delivery/out/xoyens-studio.colliders.glb art/out/xoyens-studio.colliders.glb
          mkdir -p art/textures/materials
          cp -a /tmp/fase04-delivery/textures/materials/. art/textures/materials/
          cp /tmp/fase04-delivery/textures/materials.manifest.json art/textures/materials.manifest.json
          mkdir -p public/models/camping
          cp /tmp/camping-frontend-model/xoyens-studio.glb public/models/camping/xoyens-studio.glb
          cp /tmp/camping-frontend-model/xoyens-studio.model.json public/models/camping/xoyens-studio.model.json
          node scripts/3d/pack-delivery.mjs --manifest-only
          node scripts/validate-pbr-materials.mjs --write-licenses
          node scripts/validate-pbr-materials.mjs

          # The artifact is re-verified after download, before any Git write.
          node scripts/3d/verify-delivery.mjs . docs/camping-v3/scene-bible.json --check-exit-codes

          test "$(git check-attr filter -- art/xoyens-studio.blend | awk '{print $3}')" = "lfs"
          BLEND_SHA="$(sha256sum art/xoyens-studio.blend | awk '{print $1}')"
          BLEND_SIZE="$(stat -c '%s' art/xoyens-studio.blend)"
          printf 'REAL_BLEND_SHA256=%s\nREAL_BLEND_BYTES=%s\n' "$BLEND_SHA" "$BLEND_SIZE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/xoyens-studio.blend art/textures/materials/*.png art/textures/materials.manifest.json docs/camping-v3/ASSET-LICENSES.md
          git add docs/camping-v3/phase-06/ceiling.png docs/camping-v3/phase-06/main-door.png docs/camping-v3/phase-06/capture-manifest.json
          git add public/models/camping/xoyens-studio.glb public/models/camping/xoyens-studio.model.json

          # Inspect the pointer generated by Git LFS itself and bind it to the binary hash/size.
          POINTER="$(git show :art/xoyens-studio.blend)"
          printf '%s\n' "$POINTER" | grep -Fx 'version https://git-lfs.github.com/spec/v1'
          printf '%s\n' "$POINTER" | grep -Fx "oid sha256:$BLEND_SHA"
          printf '%s\n' "$POINTER" | grep -Fx "size $BLEND_SIZE"

          if git diff --cached --quiet; then
            echo "Certified .blend is already present in the current commit."
          else
            git commit -m "build(3d): publish certified Blender source via Git LFS"
          fi

          # These commands use the real local LFS object. No pointer is hand-written.
          git lfs ls-files --long --size | tee /tmp/lfs-files.txt
          grep -F 'art/xoyens-studio.blend' /tmp/lfs-files.txt
          git lfs fsck --objects HEAD

          # Normal forward-only push. A concurrent main update must fail safely, never force-push.
          git lfs push origin HEAD
          git push origin HEAD:main
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          LOCAL_HEAD="$(git rev-parse HEAD)"
          test "$REMOTE_MAIN" = "$LOCAL_HEAD"
          echo "PUBLISHED_COMMIT=$LOCAL_HEAD"
          echo "PUBLISHED_BLEND_SHA256=$BLEND_SHA"
          echo "PUBLISHED_BLEND_BYTES=$BLEND_SIZE"
          echo "REMOTE_MAIN=$REMOTE_MAIN"
