name: Build CAMPING 3D - Fase 04
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/blender/**"
      - "scripts/3d/**"
      - "scripts/build-blend.sh"
      - "scripts/install-3d-toolchain.sh"
      - "scripts/verify-glb-contract.mjs"
      - "docs/camping-v3/scene-bible.json"
      - "package.json"
      - "docker/blender-ci/Dockerfile"
      - ".github/workflows/build-3d.yml"
concurrency:
  group: build-3d-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    name: Build, reopen and certify Blender delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout main with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip xz-utils git-lfs libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 libice6 libx11-6 libxext6 libgomp1
      - name: Syntax and recovery tests without Blender
        shell: bash
        run: |
          set -euo pipefail
          find scripts -name '*.mjs' -type f -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
          find scripts -name '*.sh' -type f -print0 | while IFS= read -r -d '' file; do bash -n "$file"; done
          python3 -m py_compile scripts/blender/*.py
          node --test scripts/3d/recovery.test.mjs
      - name: Shared route build, reopen, validate and package
        shell: bash
        run: bash scripts/3d/local-build.sh
      - name: Write evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo "CAMPING V3 Fase 04"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Exit codes:"
            cat art/_delivery/exit-codes.txt 2>/dev/null || echo "not created"
            echo "Delivery SHA-256:"
            find art/_delivery -maxdepth 1 -name 'phase04-delivery-*.sha256' -type f -exec cat {} \; 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload outputs and evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase04-entrega-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            art/_delivery/**
            art/xoyens-studio.blend
            art/xoyens-studio.report.json
            art/out/xoyens-studio.raw.glb

  publish:
    name: Promote certified Blender source through real Git LFS
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout exact certified source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: true
          fetch-depth: 0
      - name: Setup Node 22 for independent verification
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Git LFS and download certified delivery
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git-lfs
          git lfs install --local
      - name: Download artifact from the successful build job
        uses: actions/download-artifact@v4
        with:
          name: fase04-entrega-${{ github.sha }}
          path: /tmp/fase04-delivery
      - name: Reconstruct delivery, certify again and publish native file through LFS
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/fase04-delivery/xoyens-studio.blend
          test -s /tmp/fase04-delivery/xoyens-studio.report.json
          test -s /tmp/fase04-delivery/out/xoyens-studio.raw.glb
          test -s /tmp/fase04-delivery/_delivery/manifest.json
          mkdir -p art/_delivery art/out
          cp -a /tmp/fase04-delivery/_delivery/. art/_delivery/
          cp /tmp/fase04-delivery/xoyens-studio.blend art/xoyens-studio.blend
          cp /tmp/fase04-delivery/xoyens-studio.report.json art/xoyens-studio.report.json
          cp /tmp/fase04-delivery/out/xoyens-studio.raw.glb art/out/xoyens-studio.raw.glb

          # The artifact is re-verified after download, before any Git write.
          node scripts/3d/verify-delivery.mjs . docs/camping-v3/scene-bible.json --check-exit-codes

          test "$(git check-attr filter -- art/xoyens-studio.blend | awk '{print $3}')" = "lfs"
          BLEND_SHA="$(sha256sum art/xoyens-studio.blend | awk '{print $1}')"
          BLEND_SIZE="$(stat -c '%s' art/xoyens-studio.blend)"
          printf 'REAL_BLEND_SHA256=%s\nREAL_BLEND_BYTES=%s\n' "$BLEND_SHA" "$BLEND_SIZE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/xoyens-studio.blend

          # Inspect the pointer generated by Git LFS itself and bind it to the binary hash/size.
          POINTER="$(git show :art/xoyens-studio.blend)"
          printf '%s\n' "$POINTER" | grep -Fx 'version https://git-lfs.github.com/spec/v1'
          printf '%s\n' "$POINTER" | grep -Fx "oid sha256:$BLEND_SHA"
          printf '%s\n' "$POINTER" | grep -Fx "size $BLEND_SIZE"

          if git diff --cached --quiet; then
            echo "Certified .blend is already present in the current commit."
          else
            git commit -m "build(3d): publish certified Blender source via Git LFS"
          fi

          # These commands use the real local LFS object. No pointer is hand-written.
          git lfs ls-files --long --size | tee /tmp/lfs-files.txt
          grep -F 'art/xoyens-studio.blend' /tmp/lfs-files.txt
          git lfs fsck --objects HEAD

          # Normal forward-only push. A concurrent main update must fail safely, never force-push.
          git lfs push origin HEAD
          git push origin HEAD:main
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          LOCAL_HEAD="$(git rev-parse HEAD)"
          test "$REMOTE_MAIN" = "$LOCAL_HEAD"
          echo "PUBLISHED_COMMIT=$LOCAL_HEAD"
          echo "PUBLISHED_BLEND_SHA256=$BLEND_SHA"
          echo "PUBLISHED_BLEND_BYTES=$BLEND_SIZE"
          echo "REMOTE_MAIN=$REMOTE_MAIN"
