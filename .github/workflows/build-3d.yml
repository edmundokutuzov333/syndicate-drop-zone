name: Build CAMPING 3D - Blender + frontend V3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/blender/**"
      - "scripts/fetch-cc0-materials.mjs"
      - "scripts/validate-pbr-materials.mjs"
      - "scripts/3d/**"
      - "scripts/fetch-brand-assets.mjs"
      - "scripts/build-3d.mjs"
      - "scripts/check-3d-budgets.mjs"
      - "src/features/camping/scene/CampingStudioEngine.ts"
      - "src/features/camping/scene/camping-model-compatibility.ts"
      - "vite.config.ts"
      - "scripts/camping-frontend-publication-guard.ts"
      - "scripts/build-blend.sh"
      - "public/models/camping/xoyens-studio.model.json"
      - "scripts/install-3d-toolchain.sh"
      - "scripts/verify-glb-contract.mjs"
      - "scripts/verify-deployed-camping-model.mjs"
      - "docs/camping-v3/scene-bible.json"
      - "package.json"
      - "docker/blender-ci/Dockerfile"
      - ".github/workflows/build-3d.yml"
concurrency:
  group: build-3d-${{ github.ref }}
  # Only certify the newest main revision; stale builds must not hold the queue.
  cancel-in-progress: true
permissions:
  contents: read
# Release target: build and certify the real Phase 09 model before canonical promotion.
env:
  CAMPING_PHASE: "9"
jobs:
  build:
    name: Build, reopen and certify Blender delivery
    # The publish job commits its own generated model/metadata. Do not loop on that bot commit.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout main without downloading source LFS
        uses: actions/checkout@v7
        with:
          lfs: false
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip unzip xz-utils git-lfs libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 libice6 libx11-6 libxext6 libgomp1
      - name: Restore committed PBR maps from Git LFS without downloading Blender source
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          if git lfs ls-files | grep -F 'art/textures/materials/'; then
            git lfs pull --include="art/textures/materials/*.png" --exclude="art/xoyens-studio.blend"
          fi
      - name: Syntax and recovery tests without Blender
        shell: bash
        run: |
          set -euo pipefail
          find scripts -name '*.mjs' -type f -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
          find scripts -name '*.sh' -type f -print0 | while IFS= read -r -d '' file; do bash -n "$file"; done
          python3 -m py_compile scripts/blender/*.py
          node --test scripts/3d/recovery.test.mjs scripts/3d/pbr-materials.test.mjs scripts/3d/delivery-phase.test.mjs
      - name: Shared route build, reopen, validate and package
        shell: bash
        run: bash scripts/3d/local-build.sh
      - name: Upload optimized model for the frontend publication job
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: camping-frontend-model-${{ github.sha }}
          path: |
            public/models/camping/xoyens-studio.glb
            public/models/camping/xoyens-studio.model.json
            public/models/camping/xoyens-studio.colliders.glb
          if-no-files-found: error
          retention-days: 30
      - name: Render and verify Phase 06 evidence views
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/3d/env.sh ]; then source scripts/3d/env.sh; fi
          BLENDER_BIN="${BLENDER_BIN:-$(command -v blender)}"
          test -s art/xoyens-studio.blend
          LIBGL_ALWAYS_SOFTWARE=1 "$BLENDER_BIN" -b art/xoyens-studio.blend --python-exit-code 1 -P scripts/blender/capture_phase06.py -- art/_delivery/phase-06
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("art/_delivery/phase-06")
          manifest = json.loads((root / "capture-manifest.json").read_text())
          required = {"ceiling.png", "main-door.png"}
          if set(manifest.get("views", {})) != required:
              raise SystemExit("Phase 06 capture manifest must contain ceiling and main-door views")
          for name in sorted(required):
              path = root / name
              if not path.is_file() or path.stat().st_size < 10000:
                  raise SystemExit("Phase 06 capture missing or too small: " + str(path))
              if hashlib.sha256(path.read_bytes()).hexdigest() != manifest["views"][name]["sha256"]:
                  raise SystemExit("Phase 06 capture SHA-256 mismatch: " + name)
          print("PHASE 06 CAPTURES VERIFIED", json.dumps(manifest, sort_keys=True))
          PY
      - name: Render and verify Phase 08 production evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          [ ! -f scripts/3d/env.sh ] || source scripts/3d/env.sh
          BLENDER_BIN="${BLENDER_BIN:-$(command -v blender)}"
          test -s art/xoyens-studio.phase08.report.json
          LIBGL_ALWAYS_SOFTWARE=1 "$BLENDER_BIN" -b art/xoyens-studio.blend --python-exit-code 1 -P scripts/blender/capture_phase08.py -- art/_delivery/phase-08
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("art/_delivery/phase-08")
          manifest = json.loads((root / "capture-manifest.json").read_text())
          required = {"production-overview.png", "production-detail.png"}
          if set(manifest.get("views", {})) != required:
              raise SystemExit("Phase 08 evidence manifest must contain overview and detail views")
          for name in sorted(required):
              path = root / name
              if not path.is_file() or path.stat().st_size < 10000:
                  raise SystemExit("Phase 08 evidence missing or too small: " + str(path))
              if hashlib.sha256(path.read_bytes()).hexdigest() != manifest["views"][name]["sha256"]:
                  raise SystemExit("Phase 08 capture SHA-256 mismatch: " + name)
          print("PHASE 08 CAPTURES VERIFIED", json.dumps(manifest, sort_keys=True))
          PY
          node scripts/3d/pack-delivery.mjs --manifest-only --phase="${CAMPING_PHASE:-9}"
          node scripts/3d/verify-delivery.mjs . docs/camping-v3/scene-bible.json --phase="${CAMPING_PHASE:-9}" --check-exit-codes
      - name: Verify Phase 09 photo evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("art/_delivery/phase-09")
          manifest = json.loads((root / "capture-manifest.json").read_text())
          required = {"photo-overview.png", "photo-detail.png"}
          if manifest.get("phase") != 9 or set(manifest.get("views", {})) != required:
              raise SystemExit("Phase 09 evidence manifest must contain overview and detail views")
          for name in sorted(required):
              path = root / name
              if not path.is_file() or path.stat().st_size < 10000:
                  raise SystemExit("Phase 09 evidence missing or too small: " + str(path))
              if hashlib.sha256(path.read_bytes()).hexdigest() != manifest["views"][name]["sha256"]:
                  raise SystemExit("Phase 09 capture SHA-256 mismatch: " + name)
          print("PHASE 09 CAPTURES VERIFIED", json.dumps(manifest, sort_keys=True))
          PY
          node scripts/3d/pack-delivery.mjs --manifest-only --phase="${CAMPING_PHASE:-9}"
          node scripts/3d/verify-delivery.mjs . docs/camping-v3/scene-bible.json --phase="${CAMPING_PHASE:-9}" --check-exit-codes
      - name: Write evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo "CAMPING V3 Fases 06-09"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Exit codes:"
            cat art/_delivery/exit-codes.txt 2>/dev/null || echo "not created"
            echo "Delivery SHA-256:"
            find art/_delivery -maxdepth 1 -name 'phase09-delivery-*.sha256' -type f -exec cat {} \; 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload outputs and evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: camping-v3-phase09-delivery-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            art/_delivery/**
            !art/_delivery/phase09-delivery-*.zip
            !art/_delivery/phase09-delivery-*.tar.gz
            art/xoyens-studio.blend
            art/xoyens-studio.report.json
            art/out/xoyens-studio.raw.glb
            art/out/optimized/xoyens-studio.high.glb
            art/out/xoyens-studio.colliders.glb
            art/out/phase07-surfaces.json
            art/xoyens-studio.phase07.report.json
            art/xoyens-studio.phase08.report.json
            art/xoyens-studio.phase09.report.json
            art/textures/brand/**
            art/textures/materials/**
            art/textures/materials.manifest.json

  publish:
    name: Promote certified Blender source through real Git LFS
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout exact certified source commit without pulling old LFS binary
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          lfs: false
          fetch-depth: 0
      - name: Setup Node 24 for independent verification
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Git LFS and download certified delivery
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git-lfs
          git lfs install --local
      - name: Download certified Blender delivery
        uses: actions/download-artifact@v7
        with:
          name: camping-v3-phase09-delivery-${{ github.sha }}
          path: /tmp/phase09-delivery
      - name: Download optimized frontend model
        uses: actions/download-artifact@v7
        with:
          name: camping-frontend-model-${{ github.sha }}
          path: /tmp/camping-frontend-model
      - name: Reconstruct delivery, certify again and publish native file through LFS
        shell: bash
        run: |
          set -euo pipefail

          # A main push may arrive while Blender is running. Fast-forward the
          # unpublished workspace to current origin/main before creating the
          # bot commit, but refuse promotion if any geometry/material source
          # changed since the artifacts were built.
          git fetch origin main
          BUILD_COMMIT="$GITHUB_SHA"
          REMOTE_MAIN="$(git rev-parse origin/main)"
          if [[ "$REMOTE_MAIN" != "$BUILD_COMMIT" ]]; then
            git merge-base --is-ancestor "$BUILD_COMMIT" "$REMOTE_MAIN" || {
              echo "Refusing publication: build commit is not an ancestor of origin/main."
              exit 9
            }
            if ! git diff --quiet "$BUILD_COMMIT" "$REMOTE_MAIN" -- \
              scripts/blender scripts/3d scripts/build-3d.mjs scripts/verify-glb-contract.mjs \
              docs/camping-v3/scene-bible.json docs/camping-v3/phase-05 \
              art/textures/materials art/textures/materials.manifest.json; then
              echo "Refusing stale model promotion: geometry/material inputs changed after this build."
              exit 10
            fi
            git checkout --detach "$REMOTE_MAIN"
            echo "PUBLISH_BASE=$REMOTE_MAIN"
          fi

          test -s /tmp/phase09-delivery/xoyens-studio.blend
          test -s /tmp/phase09-delivery/xoyens-studio.report.json
          test -s /tmp/phase09-delivery/out/xoyens-studio.raw.glb
          test -s /tmp/phase09-delivery/out/optimized/xoyens-studio.high.glb
          if [[ "${CAMPING_PHASE:-9}" -ge 14 ]]; then
            test -s /tmp/phase09-delivery/out/xoyens-studio.colliders.glb
            test -s /tmp/camping-frontend-model/xoyens-studio.colliders.glb
          fi
          test -s /tmp/phase09-delivery/out/phase07-surfaces.json
          test -s /tmp/phase09-delivery/xoyens-studio.phase07.report.json
          test -s /tmp/phase09-delivery/xoyens-studio.phase08.report.json
          test -s /tmp/phase09-delivery/xoyens-studio.phase09.report.json
          test -s /tmp/phase09-delivery/textures/brand/sindicato-selo.png
          test -s /tmp/phase09-delivery/textures/brand/xoyens.png
          test -s /tmp/phase09-delivery/_delivery/phase-09/photo-overview.png
          test -s /tmp/phase09-delivery/_delivery/phase-09/photo-detail.png
          test -s /tmp/phase09-delivery/_delivery/phase-09/capture-manifest.json
          test -s /tmp/phase09-delivery/_delivery/phase-08/production-overview.png
          test -s /tmp/phase09-delivery/_delivery/phase-08/production-detail.png
          test -s /tmp/phase09-delivery/_delivery/phase-08/capture-manifest.json
          test -s /tmp/phase09-delivery/textures/materials.manifest.json
          test -s /tmp/camping-frontend-model/xoyens-studio.glb
          test -s /tmp/camping-frontend-model/xoyens-studio.model.json
          test -s /tmp/phase09-delivery/_delivery/phase-06/ceiling.png
          test -s /tmp/phase09-delivery/_delivery/phase-06/main-door.png
          test -s /tmp/phase09-delivery/_delivery/phase-06/capture-manifest.json
          test -s /tmp/phase09-delivery/_delivery/manifest.json
          mkdir -p art/_delivery art/out
          cp -a /tmp/phase09-delivery/_delivery/. art/_delivery/
          mkdir -p docs/camping-v3/phase-06
          cp /tmp/phase09-delivery/_delivery/phase-06/ceiling.png docs/camping-v3/phase-06/ceiling.png
          cp /tmp/phase09-delivery/_delivery/phase-06/main-door.png docs/camping-v3/phase-06/main-door.png
          cp /tmp/phase09-delivery/_delivery/phase-06/capture-manifest.json docs/camping-v3/phase-06/capture-manifest.json
          cp /tmp/phase09-delivery/xoyens-studio.blend art/xoyens-studio.blend
          cp /tmp/phase09-delivery/xoyens-studio.report.json art/xoyens-studio.report.json
          cp /tmp/phase09-delivery/out/xoyens-studio.raw.glb art/out/xoyens-studio.raw.glb
          mkdir -p art/out/optimized
          cp /tmp/phase09-delivery/out/optimized/xoyens-studio.high.glb art/out/optimized/xoyens-studio.high.glb
          if [[ "${CAMPING_PHASE:-9}" -ge 14 ]]; then
            cp /tmp/phase09-delivery/out/xoyens-studio.colliders.glb art/out/xoyens-studio.colliders.glb
            cp /tmp/camping-frontend-model/xoyens-studio.colliders.glb public/models/camping/xoyens-studio.colliders.glb
          fi
          cp /tmp/phase09-delivery/out/phase07-surfaces.json art/out/phase07-surfaces.json
          cp /tmp/phase09-delivery/xoyens-studio.phase07.report.json art/xoyens-studio.phase07.report.json
          cp /tmp/phase09-delivery/xoyens-studio.phase08.report.json art/xoyens-studio.phase08.report.json
          cp /tmp/phase09-delivery/xoyens-studio.phase09.report.json art/xoyens-studio.phase09.report.json
          mkdir -p docs/camping-v3/phase-07 docs/camping-v3/phase-08 docs/camping-v3/phase-09
          cp /tmp/phase09-delivery/xoyens-studio.phase07.report.json docs/camping-v3/phase-07/surface-validation.json
          cp /tmp/phase09-delivery/out/phase07-surfaces.json docs/camping-v3/phase-07/surface-source.json
          cp /tmp/phase09-delivery/xoyens-studio.phase08.report.json docs/camping-v3/phase-08/production-validation.json
          cp /tmp/phase09-delivery/_delivery/phase-08/production-overview.png docs/camping-v3/phase-08/production-overview.png
          cp /tmp/phase09-delivery/_delivery/phase-08/production-detail.png docs/camping-v3/phase-08/production-detail.png
          cp /tmp/phase09-delivery/_delivery/phase-08/capture-manifest.json docs/camping-v3/phase-08/capture-manifest.json
          cp /tmp/phase09-delivery/xoyens-studio.phase09.report.json docs/camping-v3/phase-09/photo-validation.json
          cp /tmp/phase09-delivery/_delivery/phase-09/photo-overview.png docs/camping-v3/phase-09/photo-overview.png
          cp /tmp/phase09-delivery/_delivery/phase-09/photo-detail.png docs/camping-v3/phase-09/photo-detail.png
          cp /tmp/phase09-delivery/_delivery/phase-09/capture-manifest.json docs/camping-v3/phase-09/capture-manifest.json
          mkdir -p art/textures/materials art/textures/brand
          cp -a /tmp/phase09-delivery/textures/brand/. art/textures/brand/
          cp -a /tmp/phase09-delivery/textures/materials/. art/textures/materials/
          cp /tmp/phase09-delivery/textures/materials.manifest.json art/textures/materials.manifest.json
          mkdir -p public/models/camping
          cp /tmp/camping-frontend-model/xoyens-studio.glb public/models/camping/xoyens-studio.glb
          cp /tmp/camping-frontend-model/xoyens-studio.model.json public/models/camping/xoyens-studio.model.json
          node scripts/verify-glb-contract.mjs public/models/camping/xoyens-studio.glb docs/camping-v3/scene-bible.json --frontend-optimized
          node scripts/3d/pack-delivery.mjs --manifest-only --phase="${CAMPING_PHASE:-9}"
          node scripts/validate-pbr-materials.mjs --write-licenses
          node scripts/validate-pbr-materials.mjs

          # The artifact is re-verified after download, before any Git write.
          node scripts/3d/verify-delivery.mjs . docs/camping-v3/scene-bible.json --phase="${CAMPING_PHASE:-9}" --check-exit-codes

          test "$(git check-attr filter -- art/xoyens-studio.blend | awk '{print $3}')" = "lfs"
          BLEND_SHA="$(sha256sum art/xoyens-studio.blend | awk '{print $1}')"
          BLEND_SIZE="$(stat -c '%s' art/xoyens-studio.blend)"
          printf 'REAL_BLEND_SHA256=%s\nREAL_BLEND_BYTES=%s\n' "$BLEND_SHA" "$BLEND_SIZE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/xoyens-studio.blend art/textures/materials/*.png art/textures/materials.manifest.json docs/camping-v3/ASSET-LICENSES.md
          git add docs/camping-v3/phase-06/ceiling.png docs/camping-v3/phase-06/main-door.png docs/camping-v3/phase-06/capture-manifest.json
          git add public/models/camping/xoyens-studio.glb public/models/camping/xoyens-studio.model.json
          if [[ "${CAMPING_PHASE:-9}" -ge 14 ]]; then git add public/models/camping/xoyens-studio.colliders.glb; fi
          git add docs/camping-v3/phase-07/surface-validation.json docs/camping-v3/phase-07/surface-source.json
          git add art/xoyens-studio.phase08.report.json docs/camping-v3/phase-08/production-validation.json
          git add art/xoyens-studio.phase09.report.json art/textures/brand/*.png docs/camping-v3/phase-09
          git add docs/camping-v3/phase-08/production-overview.png docs/camping-v3/phase-08/production-detail.png docs/camping-v3/phase-08/capture-manifest.json

          # Inspect the pointer generated by Git LFS itself and bind it to the binary hash/size.
          POINTER="$(git show :art/xoyens-studio.blend)"
          printf '%s\n' "$POINTER" | grep -Fx 'version https://git-lfs.github.com/spec/v1'
          printf '%s\n' "$POINTER" | grep -Fx "oid sha256:$BLEND_SHA"
          printf '%s\n' "$POINTER" | grep -Fx "size $BLEND_SIZE"

          if git diff --cached --quiet; then
            echo "Certified .blend is already present in the current commit."
          else
            git commit -m "build(3d): publish certified Blender source via Git LFS"
          fi

          # These commands use the real local LFS object. No pointer is hand-written.
          git lfs ls-files --long --size | tee /tmp/lfs-files.txt
          grep -F 'art/xoyens-studio.blend' /tmp/lfs-files.txt
          git lfs fsck --objects HEAD

          # Normal forward-only push. A concurrent main update must fail safely, never force-push.
          git lfs push origin HEAD
          git push origin HEAD:main
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          LOCAL_HEAD="$(git rev-parse HEAD)"
          test "$REMOTE_MAIN" = "$LOCAL_HEAD"
          echo "PUBLISHED_COMMIT=$LOCAL_HEAD"
          echo "PUBLISHED_BLEND_SHA256=$BLEND_SHA"
          echo "PUBLISHED_BLEND_BYTES=$BLEND_SIZE"
          echo "REMOTE_MAIN=$REMOTE_MAIN"

      # Publication is not certified until Lovable's public alias serves the exact
      # optimized Phase 09 GLB whose digest is recorded in the public metadata.
      # Cache-busting and SHA-256 checks reject stale CDN objects at the canonical URL.
      - name: Verify Phase 09 model served by Lovable production
        env:
          CAMPING_EXPECTED_MODEL_PHASE: "9"
          CAMPING_PRODUCTION_URL: "https://syndicate-do-trap.lovable.app"
          CAMPING_PRODUCTION_VERIFY_TIMEOUT_MS: "300000"
        run: node scripts/verify-deployed-camping-model.mjs
