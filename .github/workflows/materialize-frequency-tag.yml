name: Materialize Frequência 808 tag

on:
  push:
    branches:
      - frequency-808-asset

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download owner-supplied tag
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/audio
          curl -L --fail --retry 4 --retry-all-errors             -A "Syndicate-Drop-Zone/1.0"             -o public/audio/Frequencia_808_tag.mp3             'https://cdn.discordapp.com/attachments/1313921250678014022/1557688291342553198/Frequencia_808_tag.mp3?ex=6ac8b5c5&is=6ac76445&hm=e386a1cd3c927d40cf19dfd0ed4b159c458cd3a08a780d66eaef2859df4e760c&'
          test -s public/audio/Frequencia_808_tag.mp3
          size=$(wc -c < public/audio/Frequencia_808_tag.mp3)
          test "$size" -gt 4096
          file public/audio/Frequencia_808_tag.mp3

      - name: Commit binary asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/Frequencia_808_tag.mp3
          git diff --cached --quiet && exit 0
          git commit -m "Frequência 808: materializar identificação oficial"
          git rm .github/workflows/materialize-frequency-tag.yml
          git commit -m "Frequência 808: remover workflow temporário"
          git push origin HEAD:frequency-808-asset
