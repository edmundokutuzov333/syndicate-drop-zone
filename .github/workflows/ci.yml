name: Camera Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Camera lint
        run: "npx eslint src/lib/camera src/lib/webgl src/features/camera src/routes/camera.tsx --rule 'prettier/prettier: off'"

      - name: Engineering tests
        run: npm run test -- src/test/camera-engineering.test.ts src/test/frequency.test.ts

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Radio browser smoke tests
        run: npm run test:e2e
