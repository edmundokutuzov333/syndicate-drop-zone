stages: [build]
fase04:
  stage: build
  image: ubuntu:22.04
  timeout: 45 minutes
  variables:
    DEBIAN_FRONTEND: noninteractive
    GIT_LFS_SKIP_SMUDGE: "0"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl xz-utils git git-lfs zip unzip python3 build-essential libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 libice6 libx11-6 libxext6 libgomp1 fontconfig
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs
  script:
    - bash scripts/3d/local-build.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - art/_delivery/
      - art/xoyens-studio.blend
      - art/xoyens-studio.report.json
      - art/out/xoyens-studio.raw.glb
